version: '3.8'

services:
  power-gui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: power-gui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - POWER_GUI_HOST=0.0.0.0
      - POWER_GUI_PORT=8080
      - POWER_GUI_VAULT_PATH=/brain
      - POWER_GUI_AUTH_ENABLED=false
    volumes:
      - /root/geminicli/brain:/brain:rw
