version: '3.8'

services:
  power-gui:
    image: webyhomelab/power-gui:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: power-gui
    restart: unless-stopped
    ports:
      - "8008:8080"
    environment:
      - POWER_GUI_HOST=0.0.0.0
      - POWER_GUI_PORT=8080
      - POWER_GUI_VAULT_PATH=/brain
      - POWER_GUI_AUTH_ENABLED=false
    volumes:
      - /mnt/brain:/brain:rw
