services:
  power-gui:
    image: webyhomelab/power-gui:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: power-gui
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /home/appuser:rw,noexec,nosuid,size=128m
    ports:
      - "0.0.0.0:8008:8080"
    environment:
      - POWER_GUI_HOST=0.0.0.0
      - POWER_GUI_PORT=8080
      - POWER_GUI_VAULT_PATH=/brain
      - POWER_GUI_AUTH_ENABLED=true
      - POWER_GUI_ADMIN_PASSWORD=${POWER_GUI_ADMIN_PASSWORD:-}
      - XDG_CACHE_HOME=/data/cache
      - POWER_CACHE_DIR=/data/power_cache
      # Allow FTS fallback when dense/semantic index is not yet built
      - POWER_ALLOW_DENSE_FALLBACK=1
    volumes:
      - /mnt/brain:/brain:rw
      # Persistent cache so FTS search.db survives container restarts
      - power_cache:/data

volumes:
  power_cache:
    driver: local
