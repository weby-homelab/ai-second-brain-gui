{% extends "base.html" %}

{% block title %}Вхід до системи{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto;" class="card">
    <div style="text-align: center; margin-bottom: 24px;">
        <span class="logo-badge" style="font-size: 1rem; padding: 6px 12px;">POWER 3.7</span>
        <h1 style="font-size: 1.5rem; font-weight: 700; margin-top: 12px;">Авторизація</h1>
        <p style="color: var(--text-secondary); font-size: 0.85rem;">Введіть пароль для доступу до панелі</p>
    </div>

    <form action="/login" method="POST" style="display: flex; flex-direction: column; gap: 16px;">
        <div>
            <label for="pwd" style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px;">Пароль адміністратора:</label>
            <input type="password" id="pwd" name="password" required autofocus style="width: 100%; padding: 10px; background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; font-size: 1rem;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 1rem;">Увійти &rarr;</button>
    </form>
</div>
{% endblock %}
